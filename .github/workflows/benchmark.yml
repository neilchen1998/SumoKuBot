name: Build and Benchmark

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang and libc++
        run: |
            sudo apt-get update
            sudo apt-get install -y \
              clang-19 \
              libc++-19-dev \
              libc++abi-19-dev

      - name: Check Compiler
        run: |
          clang++-19 --version
          clang++-19 -std=c++23 -stdlib=libc++ -E -x c++ /dev/null

      - name: Configure
        # We need libc++ here to support <mdspan> on Ubuntu
        run: |
          CC=clang-19 \
          CXX="clang++-19 -stdlib=libc++" \
          cmake --preset release-benchmarks

      - name: Build
        run: cmake --build --preset release-benchmarks
