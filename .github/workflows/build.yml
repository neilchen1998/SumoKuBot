name: Build and Test

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang and libc++
        run: |
            sudo apt-get update
            sudo apt-get install -y \
              clang-19 \
              libc++-19-dev \
              libc++abi-19-dev

      - name: Check Compiler
        run: |
          clang++-19 --version
          clang++-19 -std=c++23 -stdlib=libc++ -E -x c++ /dev/null

      - name: Configure
        # We need libc++ here to support <mdspan> on Ubuntu
        run: |
          CC=clang-19 \
          CXX="clang++-19 -stdlib=libc++" \
          cmake --preset debug-tests

      - name: Build
        run: cmake --build --preset debug-tests

      - name: Run Unit Tests
        run: ctest --preset debug-tests --output-on-failure
        env:
          ASAN_OPTIONS: alloc_dealloc_mismatch=0 # for alloc-dealloc-mismatch
