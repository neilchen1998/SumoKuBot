name: Build C++

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
            sudo apt-get update
            sudo apt-get install -y g++-14

      - name: Check compiler
        run: g++-14 --version

      - name: Configure
        run: CXX=g++-14 CC=gcc-14 CI_BUILD_NUMBER=${{ github.run_number }} cmake --preset ci-release

      - name: Build
        run: cmake --build --preset ci-release
